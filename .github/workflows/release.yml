name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no tag, no release)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@bd2cd50e9c38bbab1194040edbf92c29809029a5 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
      trigger-renovate: true
      # ferrflow.json sets deferPublish: true — publish runs as a separate,
      # re-runnable job so a flaky Kellnr publish (index lag) doesn't leave a
      # crate tagged-but-unpublished.
      deferred-publish: true
    secrets: inherit
