name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no tag, no release)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@2a5ffda5cd587332696bda4ad16063839d2f4139 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
      trigger-renovate: true
    secrets: inherit
