name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not push tags or releases)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release with FerrFlow
    # Skip release commits to avoid self-triggering loops.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: FerrLabs/FerrFlow@v4
        id: ferrflow
        with:
          dry-run: ${{ inputs.dry_run == true }}
          bot: true

  notify-consumers:
    name: Notify consumer APIs of new Kit release
    needs: release
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch kit-released event
        env:
          DISPATCH_TOKEN: ${{ secrets.FERRLABS_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for repo in FerrLabs-Cloud FerrVault-Cloud FerrTrack-Cloud FerrGrowth-Cloud FerrFleet-Cloud ; do
            echo "Dispatching to $repo..."
            http_code=$(curl -sS -o /tmp/dispatch-resp -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"event_type\":\"kit-released\",\"client_payload\":{\"sha\":\"$SHA\",\"released_at\":\"$released_at\"}}" \
              "https://api.github.com/repos/FerrLabs/$repo/dispatches")
            if [ "$http_code" = "204" ]; then
              echo "  ✓ dispatched ($http_code)"
            else
              echo "  ✗ failed: HTTP $http_code"
              cat /tmp/dispatch-resp
              echo
            fi
          done
