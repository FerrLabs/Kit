name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no tag, no release)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@d0c70730b0b7234aafc7cffd1cba606313d241ff # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
      # ferrflow.json sets deferPublish: true — publish runs as a separate,
      # re-runnable job so a flaky Kellnr publish (index lag) doesn't leave a
      # crate tagged-but-unpublished.
      deferred-publish: true
      crates-io-trusted-publishing: true
    secrets: inherit
