name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secrets + CVE
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@fbe42a0de74cc0a9de20e853201f95db37fbddc0 # main
    secrets: inherit
