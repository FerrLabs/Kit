name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-rust.yml@9d4629c4b53fd72fb8685586e035fd7ddf94084c # main
    with:
      enable-sonar: true
      apt-packages: build-essential pkg-config libssl-dev
      cargo-flags: --workspace --all-features
      coverage-flags: --all-features
      clippy-args: -D warnings
      enable-deny: false
      enable-typos: false
      enable-coverage: true
    secrets: inherit
