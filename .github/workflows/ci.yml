name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Le seul garde-fou sur l'ordre de publication. FerrFlow publie dans l'ordre
  # de déclaration de ferrflow.json ; `dependsOn` documente la relation sans la
  # faire respecter. Une crate placée avant une de ses dépendances casse la
  # release, et seulement le jour où les deux bougent ensemble.
  ferrflow-order:
    name: ferrflow.json order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check-ferrflow-order.py

  ci:
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-rust.yml@d3ce80b43af8b567b503ab4c3ee44d6e33c246f5 # main
    with:
      enable-sonar: true
      cargo-flags: --workspace --all-features
      coverage-flags: --all-features
      clippy-args: -D warnings
      enable-deny: false
      enable-typos: false
      enable-coverage: true
    secrets: inherit
