name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ferrflow-order:
    name: ferrflow.json order
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s-light' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check-ferrflow-order.py

  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-rust.yml@84f44470a9ff640ea8bb32efc74d45f912660d71 # main
    with:
      enable-sonar: true
      cargo-flags: --workspace --all-features
      coverage-flags: --all-features
      clippy-args: -D warnings
      enable-deny: true
      enable-typos: false
      enable-coverage: true
    secrets: inherit
