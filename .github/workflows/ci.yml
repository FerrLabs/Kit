name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ferrflow-order:
    name: ferrflow.json order
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s-light' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check-ferrflow-order.py

  kani:
    name: Kani
    uses: FerrLabs/.github/.github/workflows/reusable-kani.yml@ca4906e7dbab75e0ea8129a3f9a3a68cb722c2a0 # main
    permissions:
      contents: read

  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-rust.yml@d0c70730b0b7234aafc7cffd1cba606313d241ff # main
    with:
      enable-sonar: true
      cargo-flags: --workspace --all-features
      coverage-flags: --all-features
      clippy-args: -D warnings
      enable-deny: true
      audit-ignore: RUSTSEC-2026-0459
      enable-typos: false
      enable-coverage: true
    secrets: inherit
