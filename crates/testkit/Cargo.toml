[package]
name = "ferrlabs-testkit"
version = "2.6.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared test helpers for FerrLabs APIs. Spins ephemeral Postgres instances for integration tests via testcontainers."

[dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
# Declared HERE rather than added to the root Cargo.toml: `uuid` is already
# there, and touching the workspace manifest republishes, in cascade, every
# crate that lists it in its sharedPaths.
uuid = { workspace = true }
# All three are already in the root workspace.dependencies for
# ferrlabs-api-version itself; referenced here without touching the root
# Cargo.toml.
ferrlabs-api-version = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
integration = []
# Golden-test harness for products built on ferrlabs-api-version: renders each
# route's response at every still-served contract version and diffs it
# against a stored fixture, so a broken transform chain fails CI instead of
# shipping quietly.
api-version-golden = ["dep:ferrlabs-api-version", "dep:http", "dep:serde_json"]
