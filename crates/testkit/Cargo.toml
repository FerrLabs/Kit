[package]
name = "ferrlabs-testkit"
version = "0.8.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared test helpers for FerrLabs APIs. Spins ephemeral Postgres instances for integration tests via testcontainers."

[dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
# Déclarée ICI et non ajoutée au Cargo.toml racine : `uuid` y figure déjà, et
# toucher le manifeste du workspace republierait en cascade les crates qui le
# listent dans leurs sharedPaths.
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
integration = []
