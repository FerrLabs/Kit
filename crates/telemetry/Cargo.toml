[package]
name = "ferrlabs-telemetry"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Tracing/OTLP setup, Prometheus HTTP metrics, and product analytics event registry for FerrLabs services and CLIs."

[features]
# Prometheus HTTP request metrics + a self-contained `/metrics` server. Gated so
# CLIs that only use `events`/`init` don't pull axum/prometheus/tokio.
metrics = ["dep:prometheus", "dep:axum", "dep:tokio"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34"
anyhow = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = "1.5"
hex = { workspace = true }
ferrlabs-types = { workspace = true }

# `metrics` feature only.
prometheus = { version = "0.14", optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
