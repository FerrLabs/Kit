# TODO: re-enable once async-stripe publishes a version that compiles on
# stable Rust. 0.40.2 has unresolved imports in its own source
# (CheckoutSessionItem, AccountCapabilities, PaymentLink). Billing is
# scaffold-only right now so the dep is unused.
#
# V1 ships per-product subscriptions persisted in the FerrLabs DB only
# (status `trialing|active|canceled`, 14-day trial clock). Stripe
# Customer mint, Checkout, Customer Portal and the
# `/v1/billing/webhook` endpoint land in V1.1 once we pick a stripe
# crate that compiles. See FerrLabs-Cloud `routes/subscriptions.rs`
# for the V1 DB-only path.
# async-stripe = { version = "0.40", default-features = false, features = ["runtime-tokio-hyper-rustls", "billing", "webhook-events"] }
