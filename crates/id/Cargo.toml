[package]
name = "ferrlabs-id"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed id newtypes over UUID to turn cross-tenant/IDOR mistakes into compile errors"
readme = "README.md"
keywords = ["uuid", "newtype", "identifier", "type-safety"]
categories = ["data-structures", "rust-patterns"]

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
