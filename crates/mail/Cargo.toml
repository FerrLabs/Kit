[package]
name = "ferrlabs-mail"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DKIM signing for outgoing mail, applied before the message reaches the relay."

[dependencies]
# Declared here rather than in the workspace dependencies: this is the only
# crate that sends mail, and an entry at the root would republish every crate
# that shares that manifest.
lettre = { version = "0.11", default-features = false, features = ["builder", "dkim"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
