[package]
name = "ferrlabs-mail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DKIM signing for outgoing mail, applied before the message reaches the relay."

[dependencies]
# Déclarée ici et non dans les dépendances du workspace : cette crate est la
# seule à envoyer du courrier, et une entrée à la racine republierait toutes
# les crates qui partagent ce manifeste.
lettre = { version = "0.11", default-features = false, features = ["builder", "dkim"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
