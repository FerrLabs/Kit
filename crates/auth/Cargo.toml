[package]
name = "ferrlabs-auth"
version = "2.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Authentication for FerrLabs APIs: JWT, sessions, OAuth, password hashing, TOTP."

[dependencies]
ferrlabs-errors = { workspace = true }
ferrlabs-types = { workspace = true }
ferrlabs-crypto = { workspace = true }
ferrlabs-db = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
async-trait = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }

[lints]
workspace = true
