[package]
name = "ferrlabs-queue"
version = "2.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Postgres-backed durable job queue for FerrLabs services (SKIP LOCKED, LISTEN/NOTIFY, retries, idempotency)."

[dependencies]
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = "0.3"
anyhow = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
uuid = { workspace = true }
# A `path` WITHOUT `version`, on purpose: cargo strips dev-dependencies that
# only have a `path` at `cargo publish` time. They are not part of the
# published contract, and a consumer of `ferrlabs-queue` never builds its
# tests.
#
# With a `version`, the dependency lands in the published manifest and
# requires the registry to already carry that version. The 2026-08-05 release
# failed exactly there: `ferrlabs-testkit` had been published seconds earlier
# in the same batch and the index had not caught up.
ferrlabs-testkit = { path = "../testkit" }

[features]
# Gates the Postgres-backed integration tests under tests/. Off by default
# so `cargo test -p ferrlabs-queue` never needs Docker or a live database;
# run with `cargo test -p ferrlabs-queue --features integration -- --ignored`.
integration = []

[lints]
workspace = true
