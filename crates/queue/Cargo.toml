[package]
name = "ferrlabs-queue"
version = "2.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Postgres-backed durable job queue for FerrLabs services (SKIP LOCKED, LISTEN/NOTIFY, retries, idempotency)."

[dependencies]
sqlx = { workspace = true, features = ["macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = "0.3"
anyhow = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
uuid = { workspace = true }
# Chemin SANS `version`, et c'est délibéré : cargo retire complètement les
# dépendances de dev qui n'ont qu'un `path` au moment de `cargo publish`.
# Elles ne font pas partie du contrat publié — un consommateur de
# `ferrlabs-queue` ne compile jamais ses tests.
#
# Avec un `version`, la dépendance entre dans le manifeste publié et exige que
# le registre porte déjà cette version : la release du 2026-08-05 a échoué là,
# `ferrlabs-testkit` venant d'être publiée quelques secondes plus tôt dans le
# même lot, sans que l'index Kellnr ait suivi.
#
# `{ workspace = true }` n'est pas une option : l'entrée du `Cargo.toml` racine
# est restée épinglée à `1.0.0` alors que la crate est en 2.2.1, et toucher ce
# fichier republierait une dizaine de crates via `sharedPaths`.
ferrlabs-testkit = { path = "../testkit" }

[features]
# Gates the Postgres-backed integration tests under tests/. Off by default
# so `cargo test -p ferrlabs-queue` never needs Docker or a live database;
# run with `cargo test -p ferrlabs-queue --features integration -- --ignored`.
integration = []

[lints]
workspace = true
