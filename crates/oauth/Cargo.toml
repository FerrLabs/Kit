[package]
name = "ferrlabs-oauth"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "OAuth 2.0 and OpenID Connect authorization-code clients, for fixed providers and for per-tenant issuers"

[features]
default = ["errors"]
errors = ["dep:ferrlabs-errors", "dep:anyhow"]

[dependencies]
base64 = { workspace = true }
ferrlabs-http = { workspace = true }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
ferrlabs-errors = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[lints]
workspace = true
