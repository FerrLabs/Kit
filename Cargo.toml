[workspace]
resolver = "2"
members = [
    "crates/audit",
    "crates/auth",
    "crates/billing",
    "crates/crypto",
    "crates/db",
    "crates/errors",
    "crates/http",
    "crates/id",
    "crates/license",
    "crates/middleware",
    "crates/permissions",
    "crates/queue",
    "crates/ratelimit",
    "crates/telemetry",
    "crates/testkit",
    "crates/types",
    "crates/vault",
    "crates/webhooks",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/FerrLabs/Kit"
authors = ["FerrLabs"]
rust-version = "1.85"

[workspace.dependencies]
# Shared across all crates
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# HTTP stack (used by most crates)
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
http = "1"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
url = "2"

# Test infra
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

# Async
tokio = { version = "1", features = ["full"] }

# DB
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.22"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.32"

# Validation
validator = "0.20"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Concurrency / timing-safe compare
dashmap = "6"
subtle = "2"

# Internal crates
ferrlabs-errors = { path = "crates/errors", version = "0.2.0", registry = "kellnr" }
ferrlabs-types = { path = "crates/types", version = "0.4.0", registry = "kellnr" }
ferrlabs-db = { path = "crates/db", version = "0.2.2", registry = "kellnr" }
ferrlabs-crypto = { path = "crates/crypto", version = "0.3.0", registry = "kellnr" }
ferrlabs-auth = { path = "crates/auth", version = "0.3.3", registry = "kellnr" }
ferrlabs-billing = { path = "crates/billing", version = "0.3.1", registry = "kellnr" }
ferrlabs-middleware = { path = "crates/middleware", version = "0.2.4", registry = "kellnr" }
ferrlabs-permissions = { path = "crates/permissions", version = "0.2.0", registry = "kellnr" }
ferrlabs-queue = { path = "crates/queue", version = "0.1.0", registry = "kellnr" }
ferrlabs-telemetry = { path = "crates/telemetry", version = "0.5.1", registry = "kellnr" }
ferrlabs-vault = { path = "crates/vault", version = "0.1.0", registry = "kellnr" }
ferrlabs-http = { path = "crates/http", version = "0.1.0", registry = "kellnr" }
ferrlabs-testkit = { path = "crates/testkit", version = "0.1.0", registry = "kellnr" }
ferrlabs-id = { path = "crates/id", version = "0.1.0", registry = "kellnr" }
ferrlabs-license = { path = "crates/license", version = "0.1.0", registry = "kellnr" }
ferrlabs-ratelimit = { path = "crates/ratelimit", version = "0.1.0", registry = "kellnr" }
ferrlabs-webhooks = { path = "crates/webhooks", version = "0.1.0", registry = "kellnr" }
ferrlabs-audit = { path = "crates/audit", version = "0.1.0", registry = "kellnr" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
